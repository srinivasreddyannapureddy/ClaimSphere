#spring.application.name=claimsphereapi

# SQL Server Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=claimsphere;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SQL Server Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Server Dialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.cache=TRACE

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

jwt.secret=VGhpc0lzQUNsYWltU3BoZXJlRGV2ZWxvcG1lbnRTZWNyZXRLZXlGb3JKV1RUZXN0aW5nMTIzNDU2Nzg5
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

#Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379

#Kafka Configuration
# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=claim-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust package for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*
